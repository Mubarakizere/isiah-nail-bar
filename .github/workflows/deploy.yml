name: Auto Deploy to Production (FTP)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. LARAVEL BACKEND DEPLOYMENT
  # ============================================================================
  deploy-backend:
    name: 🚀 Deploy Laravel Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, dom, fileinfo, gd, mbstring, pdo, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: 📦 Install Production Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          sed -i 's/Pdo\\Mysql::ATTR_SSL_CA/PDO::MYSQL_ATTR_SSL_CA/g' vendor/laravel/framework/config/database.php

      - name: 📤 Upload Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./backend/
          server-dir: backend/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/tests/**
            **/node_modules/**
            **/database/*.sqlite
            **/storage/logs/*.log
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**

  # ============================================================================
  # 2. NEXT.JS FRONTEND DEPLOYMENT
  # ============================================================================
  deploy-frontend:
    name: 🌐 Build & Deploy Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Frontend Dependencies
        run: npm install --no-audit

      - name: 🏗️ Build Next.js Standalone Production App
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://isaiahnailbar.com
          NEXT_PUBLIC_API_URL: /api/v1
          LARAVEL_API_URL: http://127.0.0.1:8000
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/next-build.log || {
            ERR_MSG=$(tail -n 60 /tmp/next-build.log | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=Next.js Build Failed::${ERR_MSG}"
            echo "## ❌ Next.js Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/next-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 🗂️ Merge Static & Public Assets for Standalone
        run: |
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public/_next/static
          mkdir -p .next/standalone/tmp
          date +%s > .next/standalone/tmp/restart.txt
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r .next/static/* .next/standalone/public/_next/static/
          cp -r public/* .next/standalone/public/
          for f in .next/static/css/*.css; do
            cp "$f" .next/standalone/.next/static/css/8aaf996120fc7f27.css 2>/dev/null || true
            cp "$f" .next/standalone/public/_next/static/css/8aaf996120fc7f27.css 2>/dev/null || true
          done
          for f in .next/static/chunks/5239-*.js; do
            cp "$f" .next/standalone/.next/static/chunks/5239-f59aa9c7e65a23ce.js 2>/dev/null || true
            cp "$f" .next/standalone/public/_next/static/chunks/5239-f59aa9c7e65a23ce.js 2>/dev/null || true
          done

      - name: 📤 Upload Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./frontend/.next/standalone/
          server-dir: frontend/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
