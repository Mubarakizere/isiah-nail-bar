name: Auto Deploy to Production (FTP)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. LARAVEL BACKEND DEPLOYMENT
  # ============================================================================
  deploy-backend:
    name: 🚀 Deploy Laravel Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, dom, fileinfo, gd, mbstring, pdo, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: 📦 Install Production Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: 📤 Upload Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_BACKEND_DIR || '/backend/' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/tests/**
            **/node_modules/**
            **/database/*.sqlite
            **/storage/logs/*.log
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**

  # ============================================================================
  # 2. NEXT.JS FRONTEND DEPLOYMENT
  # ============================================================================
  deploy-frontend:
    name: 🌐 Build & Deploy Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js Standalone Production App
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://isaiahnailbar.com
          NEXT_PUBLIC_API_URL: /api/v1
          LARAVEL_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: 🗂️ Merge Static & Public Assets for Standalone
        run: |
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public/* .next/standalone/public/

      - name: 📤 Upload Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./frontend/.next/standalone/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR || '/frontend/' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*

  # ============================================================================
  # 3. OPTIONAL POST-DEPLOY VIA SSH (MIGRATIONS & CACHE)
  # ============================================================================
  post-deploy:
    name: ⚙️ Post-Deploy (Migrations & Cache)
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Run Remote Migrations & Cache Optimization
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/stockcen/backend
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
