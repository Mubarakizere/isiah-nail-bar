x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-isaiahnailbar}
  DB_USERNAME: ${DB_USERNAME:-isaiahnailbar}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD or pass --env-file backend/.env}
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: 120
  CACHE_STORE: database

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: isaiahnailbar-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - backend/.env
    environment: *backend-environment
    volumes:
      - app-storage:/var/www/html/backend/storage/app/public
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body = @file_get_contents(\"http://127.0.0.1/up\"); exit($$body === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  queue:
    image: isaiahnailbar-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment: *backend-environment
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/html/backend/storage/app/public
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  scheduler:
    image: isaiahnailbar-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment: *backend-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/backend/storage/app/public
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        LARAVEL_API_URL: http://app
    image: isaiahnailbar-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LARAVEL_API_URL: http://app
    networks:
      - app-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  app-storage:
